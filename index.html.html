(()=>{const c=$("#bg"),x=c.getContext("2d"),rm=matchMedia("(prefers-reduced-motion:reduce)").matches,D=150;let w,h,P=[];const draw=()=>{x.clearRect(0,0,w,h);for(let i=0;i<P.length;i++){const a=P[i];if(!rm){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1}for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<D){x.strokeStyle=`rgba(127,178,255,${(1-d/D)*.55})`;x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}x.fillStyle="rgba(160,200,255,.75)";x.fillRect(a.x-1,a.y-1,2.5,2.5)}if(!rm)requestAnimationFrame(draw)};const init=()=>{w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:Math.min(90,Math.round(w*h/15000))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}));if(rm)draw()};init();if(!rm)draw();addEventListener("resize",init)})();
